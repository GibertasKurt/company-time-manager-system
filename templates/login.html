<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/static/css/loginstyles.css">
    <title>Company Time Manager - Log In</title>
</head>

<body>
    <main>
        <div>
            <div>
                <img src="/static/dashboardmenu_Icon_UQFybnln52/309587734_549724810289534_5207094967809963324_n.png" class="loginpic">
                <h1 class="hd1">Login to Time Management </h1>
            </div>
            <form method="POST">
                <input type="text" name="username" id="username" placeholder="Username" required />
                <input type="password" name="password" id="password" placeholder="Password" required />
                <button type="submit" id="btnLogin">Log In</button>
            </form>
            <a href="/register/"><p class="clkregister">No account? Register!</p></a>
            <h3><b style="color:red">{{.Err}}</b></h3>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025: Kurt Gibertas, Jose Tapic, Briana Palinsad, & John Michael Delos reyes</p>
    </footer>
</body>

</html>
